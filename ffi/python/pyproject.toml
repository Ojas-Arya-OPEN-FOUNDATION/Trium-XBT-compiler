[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "trium-xbt-sdk"
version = "0.2.0.dev0"
requires-python = ">=3.11"
description = "Explicit synchronous compiler SDK bindings; native library built separately"
[project.optional-dependencies]
numpy = ["numpy>=1.26"]
[tool.setuptools]
packages = ["trium"]
py-modules = ["bt_ffi"]
