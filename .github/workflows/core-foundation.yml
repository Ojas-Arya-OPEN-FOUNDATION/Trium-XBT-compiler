name: Core foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: debug, build_type: Debug, asan: 'OFF'}
          - {name: release, build_type: Release, asan: 'OFF'}
          - {name: sanitizers, build_type: Debug, asan: 'ON'}
    name: ${{ matrix.config.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cmake ninja -r requirements/verification.txt
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: >-
          cmake -S . -B build/ci -G Ninja -DBT_ENABLE_MLIR=OFF
          -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}
          -DBT_ENABLE_ASAN=${{ matrix.config.asan }}
      - run: cmake --build build/ci --target check-all -j 2
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
      - run: for script in verify_z3*.py; do python "$script" || exit 1; done
  native-rocq:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '4.14.2'
      - run: opam install -y rocq-core.9.1.1 rocq-runtime.9.1.1 rocq-stdlib.9.1.0
      - run: opam exec -- python3 test/check_rocq.py

  rust-client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - run: cmake -S . -B build/client -DBT_ENABLE_MLIR=OFF -DBT_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/client --target ternary_clibi -j2
      - name: Run Rust tests
        run: |
          set +e
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "### Diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "- PATH: \`$PATH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cargo which: \`$(which cargo 2>&1)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cargo version: \`$(cargo --version 2>&1)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build client contents: \`$(ls -la ${{ github.workspace }}/build/client 2>&1)\`" >> "$GITHUB_STEP_SUMMARY"
          
          TEST_OUT=$(cargo test --manifest-path ffi/rust/Cargo.toml --verbose 2>&1)
          TEST_STATUS=$?
          echo "### Cargo Test Output (exit $TEST_STATUS)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$TEST_OUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          
          echo "$TEST_OUT"
          exit $TEST_STATUS
        env:
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/build/client -L native=${{ github.workspace }}/build/client -l dylib=bt_runtime
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/client
