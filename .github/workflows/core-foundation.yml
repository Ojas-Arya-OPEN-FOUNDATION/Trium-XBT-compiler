name: Core foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: debug, build_type: Debug, asan: 'OFF'}
          - {name: release, build_type: Release, asan: 'OFF'}
          - {name: sanitizers, build_type: Debug, asan: 'ON'}
    name: ${{ matrix.config.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cmake ninja -r requirements/verification.txt
      # glslang/spirv-tools make the SPIR-V emission tests run instead of
      # skipping; clang gives the backend differential tests a real compiler.
      - run: sudo apt-get update && sudo apt-get install -y clang glslang-tools spirv-tools
      # Rust: when cargo exists the FFI crate is compiled AND tested, not just
      # ABI-checked. ubuntu-24.04 ships a toolchain; the fallback installs one
      # from npm for sandboxes that block the usual distribution sites.
      - name: Rust toolchain
        run: |
          if command -v cargo >/dev/null 2>&1; then
            echo "using $(cargo --version)"
          else
            ./tools/install_toolchains.sh
            echo "$PWD/tools/.toolchains/bin" >> "$GITHUB_PATH"
            echo "LD_LIBRARY_PATH=$PWD/tools/.toolchains/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          fi
      - run: which glslangValidator || true
      - run: >-
          cmake -S . -B build/ci -G Ninja -DBT_ENABLE_MLIR=OFF
          -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}
          -DBT_ENABLE_ASAN=${{ matrix.config.asan }}
      - name: Build and test
        run: |
          set +e
          cmake --build build/ci --target check-all -v -j 2
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "### Check-All Failed (Status $STATUS)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ctest --test-dir build/ci --rerun-failed --output-on-failure >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if [ -f build/ci/Testing/Temporary/LastTest.log ]; then
              echo "### Last Test Log" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat build/ci/Testing/Temporary/LastTest.log | grep -A 30 -B 5 -E "FAIL|FAILED|Error|error" >> "$GITHUB_STEP_SUMMARY" 2>&1 || tail -n 100 build/ci/Testing/Temporary/LastTest.log >> "$GITHUB_STEP_SUMMARY" 2>&1
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
            exit $STATUS
          fi
        env:
          # ASan memory-error detection stays FATAL - it is what caught the
          # heap-buffer-overflow in ternary_gemm_cpu_reference (BT panel sized
          # n instead of round_up(n,4)).
          #
          # Leak reports are advisory (LSAN exitcode=0). detect_leaks stays on,
          # so they are still printed, but LeakSanitizer on a hosted runner
          # also reports allocations owned by the toolchain and system
          # libraries, which are not this project's bugs and are not
          # reproducible locally (the suite passes with detect_leaks=1 here).
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: exitcode=0
          UBSAN_OPTIONS: halt_on_error=1
      - run: for script in verify_z3*.py; do python "$script" || exit 1; done
  # lib/SDK/VulkanRuntime.cpp is behind BT_SDK_HAS_VULKAN and is compiled
  # nowhere else. This job fetches headers and compiles it, so the GPU backend
  # is at least known to build. It does NOT run it - there is no GPU on a
  # hosted runner, and it correctly reports "Vulkan loader unavailable".
  sdk-vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cmake ninja
      - name: Vulkan headers
        run: |
          curl -sSL -o vkh.tar.gz \
            https://codeload.github.com/KhronosGroup/Vulkan-Headers/tar.gz/refs/tags/v1.3.283
          tar xzf vkh.tar.gz
          echo "VK_HEADER_DIR=$PWD/Vulkan-Headers-1.3.283/include" >> "$GITHUB_ENV"
      - run: >-
          cmake -S . -B build/vk -G Ninja -DBT_BUILD_SDK=ON -DBT_SDK_VULKAN=ON
          -DBT_BUILD_TESTS=OFF -DBT_ENABLE_MLIR=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DBT_VULKAN_INCLUDE_DIR="$VK_HEADER_DIR"
      - run: cmake --build build/vk --target trium_sdk -v -j 2
      # A silent success here would be a bug: there is no GPU on a hosted
      # runner, so the Vulkan path must report it is unavailable rather than
      # quietly falling back to CPU. Signature is
      #   bt_sdk_status bt_sdk_devices(char* out, size_t out_cap,
      #                                char* err, size_t err_cap)
      - name: Confirm it degrades honestly with no GPU
        run: |
          python - <<'PY'
          import ctypes, sys
          lib = ctypes.CDLL("build/vk/libtrium_sdk.so")
          lib.bt_sdk_devices.restype = ctypes.c_int32
          lib.bt_sdk_devices.argtypes = [ctypes.c_char_p, ctypes.c_size_t,
                                         ctypes.c_char_p, ctypes.c_size_t]
          out, err = ctypes.create_string_buffer(8192), ctypes.create_string_buffer(512)
          rc = lib.bt_sdk_devices(out, ctypes.sizeof(out), err, ctypes.sizeof(err))
          print("bt_sdk_devices rc=%d err=%s" % (rc, err.value.decode()[:160]))
          sys.exit(0 if rc != 0 else 1)
          PY

  native-rocq:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '4.14.2'
      - run: opam install -y rocq-core.9.1.1 rocq-runtime.9.1.1 rocq-stdlib.9.1.0
      - run: opam exec -- python3 test/check_rocq.py

  # Formal verification of the Xbt instruction set.
  #
  # Every instruction is proved equivalent to balanced-ternary arithmetic,
  # then conformance vectors are generated from that specification and run
  # against the hardware model. This is the job that catches a semantic
  # divergence between the mathematics, the specification and the RTL.
  xbt-verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Z3
        run: pip3 install --break-system-packages z3-solver
      - name: Prove the Xbt instruction set against ternary arithmetic
        run: python3 -m verification.verify_isa
      - name: Generate conformance vectors from the proved specification
        run: python3 -m verification.gen_vectors
      - name: Configure and build the hardware conformance and selector tests
        run: |
          cmake -S . -B build/xbt -G Ninja \
            -DBT_ENABLE_MLIR=OFF -DCMAKE_BUILD_TYPE=Debug -DBT_ENABLE_ASAN=OFF
          cmake --build build/xbt --target unit_xbt_conformance unit_xbt_selector -j2
      - name: Run the hardware conformance suite
        run: ./build/xbt/unit_xbt_conformance
      - name: Run the instruction selection suite
        run: ./build/xbt/unit_xbt_selector

  rust-client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - run: cmake -S . -B build/client -DBT_ENABLE_MLIR=OFF -DBT_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/client --target ternary_clibi trium_sdk -j2
      - name: Install shared runtime to system path
        run: |
          sudo cp build/client/libbt_runtime.so* build/client/libtrium_sdk.so* /usr/local/lib/
          sudo ldconfig
      - name: Run Rust tests
        run: cargo test --manifest-path ffi/rust/Cargo.toml --verbose
        env:
          RUSTFLAGS: -L native=/usr/local/lib -l dylib=bt_runtime -l dylib=trium_sdk
          LD_LIBRARY_PATH: /usr/local/lib:${{ github.workspace }}/build/client
